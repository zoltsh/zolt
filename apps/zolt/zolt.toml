[project]
name = "zolt"
main = "sh.zolt.cli.ZoltCli"

[dependencies]
"info.picocli:picocli" = "4.7.6"
"sh.zolt:zolt-build" = { workspace = true }
"sh.zolt:zolt-config" = { workspace = true }
"sh.zolt:zolt-explain" = { workspace = true }
"sh.zolt:zolt-framework-api" = { workspace = true }
"sh.zolt:zolt-ide" = { workspace = true }
"sh.zolt:zolt-init" = { workspace = true }
"sh.zolt:zolt-model" = { workspace = true }
"sh.zolt:zolt-native-image" = { workspace = true }
"sh.zolt:zolt-plan" = { workspace = true }
"sh.zolt:zolt-policy" = { workspace = true }
"sh.zolt:zolt-publish" = { workspace = true }
"sh.zolt:zolt-quality" = { workspace = true }
"sh.zolt:zolt-quarkus" = { workspace = true }
"sh.zolt:zolt-release" = { workspace = true }
"sh.zolt:zolt-repository" = { workspace = true }
"sh.zolt:zolt-resolve" = { workspace = true }
"sh.zolt:zolt-sbom" = { workspace = true }
"sh.zolt:zolt-selfhost" = { workspace = true }
"sh.zolt:zolt-test-model" = { workspace = true }
"sh.zolt:zolt-test-runtime" = { workspace = true }
"sh.zolt:zolt-toml" = { workspace = true }
"sh.zolt:zolt-toolchain" = { workspace = true }
"sh.zolt:zolt-tree" = { workspace = true }
"sh.zolt:zolt-update" = { workspace = true }
"sh.zolt:zolt-workspace" = { workspace = true }

[dependencies.test]
"org.junit.platform:junit-platform-console-standalone" = "1.11.4"

[test.suites.worker-failure-diagnostic]
classes = ["sh.zolt.error.WorkerFailureDiagnosticTest"]

[test.suites.native-reflection-inventory]
classes = [
    "sh.zolt.cli.nativeimage.CliNativeReflectionConfigTest",
    "sh.zolt.cli.nativeimage.ReflectionInventoryTest",
]

[test.suites.arch-guardrails]
classes = [
    "sh.zolt.arch.*",
    "sh.zolt.cli.nativeimage.CliNativeReflectionConfigTest",
    "sh.zolt.cli.nativeimage.ReflectionInventoryTest",
]

[test.suites.cli-help-highlighting]
classes = [
    "sh.zolt.cli.HelpOptionHighlighterTest",
    "sh.zolt.cli.HelpParameterHighlighterTest",
    "sh.zolt.cli.HelpSynopsisHighlighterTest",
]
workers = 2

[native]
args = [
    "--initialize-at-build-time=sh.zolt.cli.ZoltBuildVersion",
    "--enable-url-protocols=https",
    "--no-fallback",
    "--native-image-info",
]
