[workspace]
name = "zolt"

[workspace.members]
default = ["apps/zolt"]
include = ["apps/*", "modules/*"]

[workspace.project]
group = "sh.zolt"
version = "1.0.0"
java = 21
license = "Apache-2.0"

[versions]
groovy = "4.0.22"
kotlin = "2.2.0"
kotlinx-serialization = "1.9.0"
ksp = "2.2.0-2.0.2"
junit-platform = "1.14.4"
quarkus = "3.39.0"
tomlj = "1.3.1"

[toolchain.java]
distribution = "graalvm-community"
features = ["native-image"]
policy = "require-managed"

[coverage]
line = 88
branch = 74
