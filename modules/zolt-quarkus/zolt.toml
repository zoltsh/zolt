[project]
name = "zolt-quarkus"

[dependencies]
"sh.zolt:zolt-build" = { workspace = true }
"sh.zolt:zolt-framework-api" = { workspace = true }
"sh.zolt:zolt-ide" = { workspace = true }
"sh.zolt:zolt-model" = { workspace = true }
"sh.zolt:zolt-repository" = { workspace = true }
"sh.zolt:zolt-resolve" = { workspace = true }
"sh.zolt:zolt-test-model" = { workspace = true }
"sh.zolt:zolt-toml" = { workspace = true }

[dependencies.provided]
"io.quarkus:quarkus-builder" = "3.33.2"
"io.quarkus:quarkus-core-deployment" = "3.33.2"
"io.quarkus:quarkus-junit" = "3.33.2"
"io.smallrye:jandex" = "3.5.3"

[dependencies.test]
"io.quarkus:quarkus-arc-deployment" = { version = "3.33.2", exclude = ["io.quarkus:quarkus-arc", "io.quarkus:quarkus-arc-dev", "io.quarkus:quarkus-arc-test-supplement", "io.quarkus:quarkus-arc-test-supplement-decorator", "io.quarkus:quarkus-core-deployment", "io.quarkus:quarkus-devui-deployment-spi", "io.quarkus:quarkus-smallrye-context-propagation-spi", "io.quarkus.arc:arc-processor"] }
"io.quarkus:quarkus-bootstrap-app-model" = { version = "3.33.2", exclude = ["io.quarkus:quarkus-fs-util", "org.jboss.logging:commons-logging-jboss-logging", "org.jboss.logging:jboss-logging"] }
"io.quarkus:quarkus-fs-util" = "1.3.0"
"io.quarkus:quarkus-test-common" = { version = "3.33.2", exclude = ["commons-io:commons-io", "io.quarkus:quarkus-bootstrap-gradle-resolver", "io.quarkus:quarkus-bootstrap-maven-resolver", "io.quarkus:quarkus-core-deployment", "io.rest-assured:rest-assured", "io.smallrye:jandex", "org.jboss.logging:commons-logging-jboss-logging"] }
"org.junit.platform:junit-platform-console-standalone" = "1.11.4"
"org.wildfly.common:wildfly-common" = { version = "2.0.1", exclude = ["io.smallrye.common:smallrye-common-cpu", "io.smallrye.common:smallrye-common-expression", "io.smallrye.common:smallrye-common-net", "io.smallrye.common:smallrye-common-os", "io.smallrye.common:smallrye-common-ref", "org.jboss.logging:jboss-logging"] }
