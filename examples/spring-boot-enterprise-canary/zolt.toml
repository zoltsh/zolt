[project]
name = "spring-boot-enterprise-canary"
version = "0.1.0"
group = "com.example.enterprise"
java = 21
main = "com.example.enterprise.EnterpriseCanaryApplication"
description = "Public-safe enterprise Spring Boot canary for Zolt."
url = "https://example.sh/zolt-enterprise-canary"
issues = "https://example.sh/zolt-enterprise-canary/issues"
license = "Apache-2.0"

[project.scm]
url = "https://example.sh/zolt-enterprise-canary.git"

[project.developers.zolt-maintainers]
name = "Zolt maintainers"

[platforms]
"org.springframework.boot:spring-boot-dependencies" = "4.0.6"

[dependencies]
"org.springframework.boot:spring-boot-starter-actuator" = { managed = true }
"org.springframework.boot:spring-boot-starter-log4j2" = { managed = true }
"org.springframework.boot:spring-boot-starter-validation" = { managed = true }
"org.springframework.boot:spring-boot-starter-webmvc" = { managed = true, exclude = ["org.apache.tomcat.embed:tomcat-embed-core", "org.apache.tomcat.embed:tomcat-embed-el", "org.apache.tomcat.embed:tomcat-embed-websocket"] }

[dependencies.runtime]
"org.apache.logging.log4j:log4j-jul" = { managed = true }
"org.slf4j:jcl-over-slf4j" = { managed = true }

[dependencies.provided]
"jakarta.servlet:jakarta.servlet-api" = { managed = true }
"org.apache.tomcat.embed:tomcat-embed-core" = "11.0.21"
"org.apache.tomcat.embed:tomcat-embed-el" = "11.0.21"
"org.apache.tomcat.embed:tomcat-embed-websocket" = "11.0.21"
"org.projectlombok:lombok" = { managed = true }

[dependencies.dev]
"org.springframework.boot:spring-boot-devtools" = { managed = true }

[dependencies.test]
"org.springframework.boot:spring-boot-starter-test" = { managed = true }

[dependencies.processor]
"org.projectlombok:lombok" = { managed = true }
"org.springframework.boot:spring-boot-configuration-processor" = { managed = true }

[dependencies.test-processor]
"org.projectlombok:lombok" = { managed = true }

[dependencies.constraints]
"org.apache.tomcat.embed:tomcat-embed-core" = { version = "11.0.21", reason = "Servlet container security baseline" }
"org.apache.tomcat.embed:tomcat-embed-el" = { version = "11.0.21", reason = "Servlet container security baseline" }
"org.apache.tomcat.embed:tomcat-embed-websocket" = { version = "11.0.21", reason = "Servlet container security baseline" }

[dependencies.policy]
deny = [
    { coordinate = "org.springframework.boot:spring-boot-starter-logging", reason = "Use the Log4j2 enterprise logging baseline" },
    { coordinate = "commons-logging:commons-logging", reason = "Use Spring JCL and SLF4J bridges instead of legacy commons-logging" },
]

[build.metadata]
buildInfo = true
git = true
reproducible = true

[resources.filter]
include = ["**/*.properties"]

[resources.tokens]
enterprise-platform-version = { value = "public-canary-2026.06" }
project-version = { project = "version" }

[generated.tools.openapi]
coordinate = "org.openapitools:openapi-generator-cli"
version = "7.11.0"

[generated.presets.spring-api]
kind = "openapi"
generator = "spring"
library = "spring-boot"
apiPackage = "com.example.enterprise.generated.api"
modelPackage = "com.example.enterprise.generated.model"
invokerPackage = "com.example.enterprise.generated"
additionalProperties = { sourceFolder = ".", interfaceOnly = "true", useTags = "true", useSpringBoot3 = "true", skipDefaultInterface = "true", generatedAnnotation = "false", openApiNullable = "false", additionalModelTypeAnnotations = "@lombok.Builder;@lombok.NoArgsConstructor;@lombok.AllArgsConstructor" }
configOptions = { dateLibrary = "java8", documentationProvider = "none", useJakartaEe = "true" }

[generated.main.public-api]
kind = "openapi"
input = "src/main/openapi/public-api.yaml"
output = "target/generated/sources/openapi/public-api"
preset = "spring-api"

[test.runtime]
properties = { "logs.dir" = "target/test-logs" }
env = { TZ = "America/Chicago" }
events = ["skipped", "failed"]

[package]
mode = "spring-boot-war"

[publish]
release = "company-releases"
snapshot = "company-snapshots"

[publish.repositories.company-releases]
url = "https://repo.example.test/releases"

[publish.repositories.company-snapshots]
url = "https://repo.example.test/snapshots"
