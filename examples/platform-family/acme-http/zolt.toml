[project]
name = "acme-http"
version = "1.0.0"
group = "com.acme"
java = 21
description = "HTTP client built on Acme Core."
url = "https://example.test/acme"
license = "Apache-2.0"

[project.scm]
url = "https://github.com/example/acme"
connection = "scm:git:https://github.com/example/acme.git"

[dependencies.api]
"com.acme:acme-core" = { workspace = true }

[publish]
release = "local"

[publish.repositories.local]
url = "https://repo.example.test/releases"
