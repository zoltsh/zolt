[project]
name = "protobuf-grpc-canary"
version = "0.1.0"
group = "com.example"
java = 21
main = "com.example.protobuf.Main"

[versions]
grpc = "1.68.1"
protobuf = "4.28.3"

[dependencies.test]
"org.junit.platform:junit-platform-console-standalone" = "1.11.4"

[generated.tools.protobuf]
protocCoordinate = "com.google.protobuf:protobuf-java"
protocVersionRef = "protobuf"
grpcCoordinate = "io.grpc:grpc-api"
grpcVersionRef = "grpc"

[generated.main.greeter]
kind = "protobuf"
inputs = ["src/main/proto/greeter.proto"]
output = "target/generated/sources/protobuf"
