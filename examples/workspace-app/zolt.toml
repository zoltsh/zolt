[workspace]
name = "workspace-app"

[workspace.members]
default = ["apps/api"]
include = ["apps/*", "modules/*", "tools"]

[workspace.project]
group = "com.example.workspace"
version = "0.1.0"
java = 21

[tasks.release-notes]
description = "Run the Java tools member release-notes command"
run = ["zolt", "run", "--workspace", "--member", "tools", "--", "release-notes"]
