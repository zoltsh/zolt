[project]
name = "slf4j-simple"
description = "Small logging binding fixture for Zolt workspace canary testing."
url = "https://www.slf4j.org/"
issues = "https://jira.qos.ch/projects/SLF4J"

[project.scm]
url = "https://github.com/qos-ch/slf4j.git"

[project.developers.zolt-team]
name = "Zolt Team"

[dependencies]
"org.apache.logging.log4j:log4j-to-slf4j" = { version = "2.25.4", optional = true, exclude = ["org.apache.logging.log4j:log4j-api", "org.slf4j:slf4j-api"] }

[dependencies.api]
"org.slf4j:slf4j-api" = { workspace = true }

[dependencies.test]
"junit:junit" = "4.13.2"
"org.junit.platform:junit-platform-console-standalone" = "1.11.4"
"org.junit.vintage:junit-vintage-engine" = "5.11.4"

[compiler]
args = ["-Xlint:deprecation"]

[compiler.test]
args = ["-Xlint:unchecked"]

[test.runtime]
properties = { "slf4j.canary.mode" = "workspace" }

[package]
sources = true
javadoc = true
testJar = true

[package.manifest]
"Automatic-Module-Name" = "org.slf4j.simple"
"Bundle-SymbolicName" = "org.slf4j.simple"
"Bundle-Version" = "0.1.0"
"Export-Package" = "org.slf4j.simple"
"Import-Package" = "org.slf4j"
