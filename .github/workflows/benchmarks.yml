name: benchmarks

on:
  push:
    branches:
      - benchmark-improvements
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile.
        required: true
        default: publishable
        type: choice
        options:
          - smoke
          - candidate
          - publishable
          - full

permissions:
  contents: read

jobs:
  plan:
    name: validate and plan benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BENCHMARK_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'smoke' }}
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
      profile_sha256: ${{ steps.profile.outputs.profile_sha256 }}
      matrix: ${{ steps.profile.outputs.matrix }}
      lane_count: ${{ steps.profile.outputs.lane_count }}
      zolt_source: ${{ steps.profile.outputs.zolt_source }}
      release_channel: ${{ steps.profile.outputs.release_channel }}
      release_version: ${{ steps.release.outputs.version }}
      ai_summary: ${{ steps.profile.outputs.ai_summary }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve benchmark profile
        id: profile
        run: |
          mkdir -p target/benchmark-plan
          scripts/benchmark-profile show \
            --profile "$BENCHMARK_PROFILE" \
            > target/benchmark-plan/profile.json
          matrix="$(scripts/benchmark-profile matrix --profile "$BENCHMARK_PROFILE")"
          {
            printf 'profile=%s\n' "$BENCHMARK_PROFILE"
            printf 'profile_sha256=%s\n' \
              "$(jq -r .sha256 target/benchmark-plan/profile.json)"
            printf 'matrix=%s\n' "$matrix"
            printf 'lane_count=%s\n' \
              "$(jq -r '.include | length' <<<"$matrix")"
            printf 'zolt_source=%s\n' \
              "$(jq -r .zolt.source target/benchmark-plan/profile.json)"
            printf 'release_channel=%s\n' \
              "$(jq -r .zolt.channel target/benchmark-plan/profile.json)"
            printf 'ai_summary=%s\n' \
              "$(jq -r .aiSummary target/benchmark-plan/profile.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Validate benchmark contracts
        run: |
          scripts/benchmark-statistics-test
          scripts/benchmark-shard-summaries-test
          scripts/benchmark-profile-test
          scripts/benchmark-suite-test
          scripts/benchmark-openai-summary-test
          scripts/benchmark-enterprise-test
          scripts/benchmark-self-host-test
          scripts/benchmark-large-source-test
          scripts/benchmark-large-source-report-test
          scripts/benchmark-netty-compare-test
          scripts/benchmark-real-project-test
          scripts/install-zolt-test
          scripts/zap-distribution-test

      - name: Resolve released Zolt once
        id: release
        if: steps.profile.outputs.zolt_source == 'release'
        run: |
          export ZOLT_INSTALL_ROOT="$GITHUB_WORKSPACE/target/benchmark-plan/zolt-install"
          export ZOLT_INSTALL_CHANNEL="${{ steps.profile.outputs.release_channel }}"
          export ZOLT_INSTALL_TARGET=linux-x64
          scripts/install-zolt
          zolt_version="$("$ZOLT_INSTALL_ROOT/bin/zolt" --version)"
          printf 'version=%s\n' "$zolt_version" >> "$GITHUB_OUTPUT"
          printf 'Resolved benchmark release: %s\n' "$zolt_version"

  build-zolt:
    name: build branch benchmark distribution
    needs: plan
    if: needs.plan.outputs.zolt_source == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f
        with:
          distribution: graalvm
          java-version: "21"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Zolt artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .zolt/cache
          key: zolt-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zolt.lock') }}
          restore-keys: |
            zolt-cache-${{ runner.os }}-${{ runner.arch }}-
            zolt-cache-${{ runner.os }}-

      - name: Cache Zolt managed toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.zolt/toolchains
          key: zolt-toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zolt.lock') }}
          restore-keys: |
            zolt-toolchains-${{ runner.os }}-${{ runner.arch }}-
            zolt-toolchains-${{ runner.os }}-

      - name: Build and verify native Zolt
        run: |
          scripts/bootstrap-zolt-jvm --no-progress toolchain sync
          scripts/zap-distribution --target linux-x64
          shopt -s nullglob
          archives=(apps/zolt/target/release/zap/*/zolt-*-linux-x64.tar.gz)
          shopt -u nullglob
          if [[ "${#archives[@]}" -ne 1 ]]; then
            printf 'error: expected exactly one built Zolt archive, found %s\n' \
              "${#archives[@]}" >&2
            exit 1
          fi
          mkdir -p target/benchmark-zolt-build
          cp "${archives[0]}" target/benchmark-zolt-build/zolt-build.tar.gz

      - name: Upload branch benchmark distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zolt-benchmark-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/benchmark-zolt-build/zolt-build.tar.gz
          if-no-files-found: error

  benchmark:
    name: benchmark (${{ needs.plan.outputs.profile }} / ${{ matrix.id }})
    needs:
      - plan
      - build-zolt
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (needs.build-zolt.result == 'success' || needs.build-zolt.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      BENCHMARK_PROFILE_ID: ${{ needs.plan.outputs.profile }}
      BENCHMARK_PROFILE_SHA256: ${{ needs.plan.outputs.profile_sha256 }}
      BENCHMARK_ZOLT_SOURCE: ${{ needs.plan.outputs.zolt_source }}
      BENCHMARK_RELEASE_CHANNEL: ${{ needs.plan.outputs.release_channel }}
      BENCHMARK_RELEASE_VERSION: ${{ needs.plan.outputs.release_version }}
      BENCHMARK_LANE_ID: ${{ matrix.id }}
      BENCHMARK_DIR: target/benchmarks/shards/${{ matrix.id }}
      BENCHMARK_GRADLE_VERSION: "9.6.1"
      BENCHMARK_ARTIFACT_NAME: zolt-benchmark-${{ needs.plan.outputs.profile }}-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle
        run: |
          gradle_root="$RUNNER_TEMP/gradle"
          gradle_zip="$RUNNER_TEMP/gradle-${BENCHMARK_GRADLE_VERSION}-bin.zip"
          mkdir -p "$gradle_root"
          curl -fsSL \
            "https://services.gradle.org/distributions/gradle-${BENCHMARK_GRADLE_VERSION}-bin.zip" \
            -o "$gradle_zip"
          unzip -q "$gradle_zip" -d "$gradle_root"
          printf '%s/gradle-%s/bin\n' \
            "$gradle_root" "$BENCHMARK_GRADLE_VERSION" >> "$GITHUB_PATH"

      - name: Prefer configured JDK tools
        run: printf '%s/bin\n' "$JAVA_HOME" >> "$GITHUB_PATH"

      - name: Download branch benchmark distribution
        if: env.BENCHMARK_ZOLT_SOURCE == 'build'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: zolt-benchmark-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/benchmark-zolt-build

      - name: Install branch benchmark distribution
        if: env.BENCHMARK_ZOLT_SOURCE == 'build'
        run: |
          install_root="$GITHUB_WORKSPACE/target/benchmarks/zolt-install"
          mkdir -p "$install_root"
          tar -xzf target/benchmark-zolt-build/zolt-build.tar.gz \
            --strip-components=1 \
            -C "$install_root"
          test -x "$install_root/bin/zolt"
          test -f "$install_root/libexec/zolt-javac-worker.jar"
          zolt_version="$("$install_root/bin/zolt" --version)"
          printf 'ZOLT_BENCH_ZOLT=%s/bin/zolt\n' "$install_root" >> "$GITHUB_ENV"
          printf 'ZOLT_BENCH_VERSION=%s\n' "$zolt_version" >> "$GITHUB_ENV"

      - name: Install released zap
        if: env.BENCHMARK_ZOLT_SOURCE == 'release'
        run: |
          export ZOLT_INSTALL_ROOT="$GITHUB_WORKSPACE/target/benchmarks/zolt-install"
          export ZOLT_INSTALL_CHANNEL="$BENCHMARK_RELEASE_CHANNEL"
          export ZOLT_INSTALL_TARGET=linux-x64
          export ZOLT_INSTALL_VERSION="$BENCHMARK_RELEASE_VERSION"
          case "$BENCHMARK_RELEASE_CHANNEL" in
            stable) release_tag="zolt-v$BENCHMARK_RELEASE_VERSION" ;;
            preview) release_tag="zolt-preview-v$BENCHMARK_RELEASE_VERSION" ;;
            zap) release_tag="zolt-zap-$BENCHMARK_RELEASE_VERSION" ;;
            *)
              printf 'error: unsupported benchmark release channel: %s\n' \
                "$BENCHMARK_RELEASE_CHANNEL" >&2
              exit 1
              ;;
          esac
          export ZOLT_INSTALL_CHANNEL_URL="https://github.com/zoltsh/releases/releases/download/$release_tag/channel-$BENCHMARK_RELEASE_CHANNEL.json"
          scripts/install-zolt
          zolt_version="$("$ZOLT_INSTALL_ROOT/bin/zolt" --version)"
          {
            printf 'ZOLT_BENCH_ZOLT=%s/bin/zolt\n' "$ZOLT_INSTALL_ROOT"
            printf 'ZOLT_BENCH_VERSION=%s\n' "$zolt_version"
            printf 'BENCHMARK_RELEASE_VERSION=%s\n' "$zolt_version"
          } >> "$GITHUB_ENV"

      - name: Show benchmark tool versions
        run: |
          java --version
          javac -version
          mvn --version
          gradle --version
          "$ZOLT_BENCH_ZOLT" --version

      - name: Run profile lane
        run: |
          artifact_name="zolt-benchmark-${BENCHMARK_PROFILE_ID}-${BENCHMARK_LANE_ID}-${ZOLT_BENCH_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'BENCHMARK_ARTIFACT_NAME=%s\n' "$artifact_name" >> "$GITHUB_ENV"
          lane_status=0
          scripts/benchmark-profile run \
            --profile "$BENCHMARK_PROFILE_ID" \
            --lane "$BENCHMARK_LANE_ID" \
            --zolt "$ZOLT_BENCH_ZOLT" \
            --resolved-zolt-version "${BENCHMARK_RELEASE_VERSION:-$ZOLT_BENCH_VERSION}" \
            --work-dir "$BENCHMARK_DIR" \
            --artifact-name "$artifact_name" \
            || lane_status=$?
          mkdir -p target/benchmark-shard-summaries
          if [[ -f "$BENCHMARK_DIR/suite-summary.json" ]]; then
            cp "$BENCHMARK_DIR/suite-summary.json" \
              "target/benchmark-shard-summaries/${BENCHMARK_LANE_ID}.json"
          else
            printf 'error: benchmark lane did not produce suite-summary.json\n' >&2
            lane_status=1
          fi
          exit "$lane_status"

      - name: Write lane summary
        if: always()
        run: |
          # Literal backticks below are Markdown output.
          # shellcheck disable=SC2016
          {
            printf '# Zolt Benchmark\n\n'
            printf '| Field | Value |\n'
            printf '| --- | --- |\n'
            printf '| Profile | `%s` |\n' "$BENCHMARK_PROFILE_ID"
            printf '| Lane | `%s` |\n' "$BENCHMARK_LANE_ID"
            printf '| Zolt source | `%s` |\n' "$BENCHMARK_ZOLT_SOURCE"
            printf '| Zolt version | `%s` |\n' "${ZOLT_BENCH_VERSION:-unavailable}"
            printf '\n'
            if [[ -f "$BENCHMARK_DIR/summary-brief.md" ]]; then
              cat "$BENCHMARK_DIR/summary-brief.md"
            else
              printf 'This lane did not produce a suite summary. Inspect its logs.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lane artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.BENCHMARK_ARTIFACT_NAME }}
          path: |
            ${{ env.BENCHMARK_DIR }}/**
            target/benchmark-shard-summaries/${{ matrix.id }}.json
            benchmarks/profiles/${{ needs.plan.outputs.profile }}.json
            benchmarks/workloads/**
            benchmarks/adapters/**
            docs/benchmarks/projects.json
            !${{ env.BENCHMARK_DIR }}/**/cache/**
            !${{ env.BENCHMARK_DIR }}/**/caches/**
            !${{ env.BENCHMARK_DIR }}/**/checkout/**
            !${{ env.BENCHMARK_DIR }}/**/fixtures/**
            !${{ env.BENCHMARK_DIR }}/**/projects/**
            !${{ env.BENCHMARK_DIR }}/**/workspace/**
            !${{ env.BENCHMARK_DIR }}/real-project-cache/**
            !target/benchmarks/shards/*/real-projects/*/checkout/**
          if-no-files-found: warn

  aggregate:
    name: aggregate benchmark evidence
    needs:
      - plan
      - benchmark
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BENCHMARK_PROFILE_ID: ${{ needs.plan.outputs.profile }}
      BENCHMARK_PROFILE_SHA256: ${{ needs.plan.outputs.profile_sha256 }}
      BENCHMARK_ZOLT_SOURCE: ${{ needs.plan.outputs.zolt_source }}
      BENCHMARK_RELEASE_CHANNEL: ${{ needs.plan.outputs.release_channel }}
      BENCHMARK_AI_SUMMARY: ${{ needs.plan.outputs.ai_summary }}
      BENCHMARK_DIR: target/benchmarks/combined
      BENCHMARK_ARTIFACT_NAME: zolt-benchmark-${{ needs.plan.outputs.profile }}-combined-${{ github.run_id }}-${{ github.run_attempt }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'high' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download lane artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: zolt-benchmark-${{ needs.plan.outputs.profile }}-*
          path: target/downloaded-benchmark-shards
          merge-multiple: true

      - name: Aggregate lane summaries
        run: |
          summary_list="$RUNNER_TEMP/benchmark-lane-summaries.txt"
          scripts/benchmark-shard-summaries \
            --root target/downloaded-benchmark-shards \
            --expected-count "${{ needs.plan.outputs.lane_count }}" \
            > "$summary_list"
          mapfile -t summaries < "$summary_list"
          args=(
            --skip-generated
            --work-dir "$BENCHMARK_DIR"
            --artifact-name "$BENCHMARK_ARTIFACT_NAME"
          )
          for summary in "${summaries[@]}"; do
            args+=(--lane-summary "$summary")
          done
          scripts/benchmark-suite "${args[@]}"

      - name: Prepare model benchmark summary
        if: always() && env.BENCHMARK_AI_SUMMARY == 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ ! -f "$BENCHMARK_DIR/suite-summary.json" ]]; then
            printf 'Suite summary was not generated; skipping model summary.\n'
            exit 0
          fi
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            printf 'OPENAI_API_KEY is not configured; skipping model summary.\n'
            exit 0
          fi
          scripts/benchmark-openai-summary \
            --input "$BENCHMARK_DIR/suite-summary.json" \
            --output-json "$BENCHMARK_DIR/summary-ai.json" \
            --output-markdown "$BENCHMARK_DIR/summary-ai.md" \
            --model "$OPENAI_MODEL" \
            --reasoning-effort "$OPENAI_REASONING_EFFORT"

      - name: Write combined summary
        if: always()
        run: |
          {
            printf '# Zolt Benchmark Profile: %s\n\n' "$BENCHMARK_PROFILE_ID"
            if [[ -f "$BENCHMARK_DIR/summary-brief.md" ]]; then
              cat "$BENCHMARK_DIR/summary-brief.md"
              if [[ -f "$BENCHMARK_DIR/summary-ai.md" ]]; then
                printf '\n'
                cat "$BENCHMARK_DIR/summary-ai.md"
              fi
            else
              printf 'The combined benchmark summary was not generated.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined benchmark artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.BENCHMARK_ARTIFACT_NAME }}
          path: |
            target/benchmarks/combined/**
            target/downloaded-benchmark-shards/**
            benchmarks/profiles/${{ needs.plan.outputs.profile }}.json
          if-no-files-found: warn
