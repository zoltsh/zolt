name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: foundation
            members: modules/zolt-model,modules/zolt-framework-api,modules/zolt-toml,modules/zolt-repository,modules/zolt-resolve,modules/zolt-test-model,modules/zolt-junit-client
          - name: build-runtime
            members: modules/zolt-build,modules/zolt-test-runtime,modules/zolt-native-image,modules/zolt-workspace
          - name: quarkus
            members: modules/zolt-ide,modules/zolt-quarkus
          - name: release-quality
            members: modules/zolt-release,modules/zolt-publish,modules/zolt-policy,modules/zolt-quality,modules/zolt-tree,modules/zolt-plan
          - name: cli-apps
            members: modules/zolt-explain,modules/zolt-config,modules/zolt-selfhost,modules/zolt-init,apps/zolt-javac-worker,apps/zolt-junit-worker,apps/zolt

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f
        with:
          distribution: graalvm
          java-version: "21"
          components: native-image
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Zolt artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .zolt/cache
          key: zolt-cache-${{ runner.os }}-${{ hashFiles('zolt.lock') }}
          restore-keys: |
            zolt-cache-${{ runner.os }}-

      - name: Cache Zolt managed toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.zolt/toolchains
          key: zolt-toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zolt.lock') }}
          restore-keys: |
            zolt-toolchains-${{ runner.os }}-${{ runner.arch }}-
            zolt-toolchains-${{ runner.os }}-

      - name: Bootstrap sync Zolt-managed Java
        run: scripts/bootstrap-zolt-jvm --no-progress toolchain sync

      - name: Package stage-0 Zolt
        run: scripts/bootstrap-zolt-jvm --no-progress package --workspace --member apps/zolt --cache-root .zolt/cache

      - name: Sync Zolt-managed Java
        run: scripts/run-zolt-built toolchain sync

      - name: Check Zolt-managed Java status
        run: scripts/run-zolt-built toolchain status --json

      - name: Package JUnit worker with managed Java
        run: scripts/run-zolt-built package --workspace --member apps/zolt-junit-worker --no-progress --cache-root .zolt/cache

      - name: Package javac worker with managed Java
        run: scripts/run-zolt-built package --workspace --member apps/zolt-javac-worker --no-progress --cache-root .zolt/cache

      - name: Assert gpg is available for reproducible-signing tests
        # The release-quality group runs the zolt-publish reproducible-signing suite, whose tests skip
        # when gpg is absent. Fail loudly so a runner without gpg is a visible CI failure rather than a
        # silent skip of a release-critical contract. ubuntu-latest ships gnupg, so no install is needed.
        if: matrix.name == 'release-quality'
        run: |
          if ! command -v gpg >/dev/null 2>&1; then
            printf 'gpg is required for the zolt-publish reproducible-signing tests but was not found on PATH.\n' >&2
            exit 1
          fi
          gpg --version

      - name: Test zap publication boundary
        if: matrix.name == 'release-quality'
        run: scripts/zap-distribution-test

      - name: Test workspace group with managed Java
        run: scripts/run-zolt-built test --workspace --members "${{ matrix.members }}" --no-progress --cache-root .zolt/cache

  coverage:
    name: coverage floors
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f
        with:
          distribution: graalvm
          java-version: "21"
          components: native-image
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Zolt artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .zolt/cache
          key: zolt-cache-${{ runner.os }}-${{ hashFiles('zolt.lock') }}
          restore-keys: |
            zolt-cache-${{ runner.os }}-

      - name: Cache Zolt managed toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.zolt/toolchains
          key: zolt-toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zolt.lock') }}
          restore-keys: |
            zolt-toolchains-${{ runner.os }}-${{ runner.arch }}-
            zolt-toolchains-${{ runner.os }}-

      - name: Bootstrap sync Zolt-managed Java
        run: scripts/bootstrap-zolt-jvm --no-progress toolchain sync

      - name: Package stage-0 Zolt
        run: scripts/bootstrap-zolt-jvm --no-progress package --workspace --member apps/zolt --cache-root .zolt/cache

      - name: Sync Zolt-managed Java
        run: scripts/run-zolt-built toolchain sync

      - name: Package JUnit worker with managed Java
        run: scripts/run-zolt-built package --workspace --member apps/zolt-junit-worker --no-progress --cache-root .zolt/cache

      - name: Package javac worker with managed Java
        run: scripts/run-zolt-built package --workspace --member apps/zolt-javac-worker --no-progress --cache-root .zolt/cache

      - name: Assert gpg is available for reproducible-signing tests
        # coverage --all executes the zolt-publish reproducible-signing suite, which skips without gpg.
        # Fail loudly so a missing gpg cannot silently drop that release-critical coverage.
        run: |
          if ! command -v gpg >/dev/null 2>&1; then
            printf 'gpg is required for the zolt-publish reproducible-signing tests but was not found on PATH.\n' >&2
            exit 1
          fi
          gpg --version

      - name: Enforce coverage floors across the workspace
        run: scripts/run-zolt-built coverage --workspace --all --no-progress --cache-root .zolt/cache

  smoke:
    # Each suite runs as its own matrix lane so a slow suite cannot eat the budget
    # of the others: the timeout below applies per lane, not to all four together.
    # Any lane that builds a real Native Image gets 60 minutes rather than 30: a
    # single native-image invocation is allowed up to ten minutes on its own (the
    # Zolt self-host build up to fifteen), and the native lane chains six such
    # suites. native-container runs only one, but it is the same open-ended step
    # plus a PostgreSQL container pull, so it takes the same ceiling. An unused
    # ceiling costs nothing; a short one costs a red build.
    name: smoke packaged workflows ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            suite: ""
            timeout: 30
          - name: container
            suite: container
            timeout: 30
          - name: native
            suite: native
            timeout: 60
          - name: native-container
            suite: native-container
            timeout: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f
        with:
          distribution: graalvm
          java-version: "21"
          components: native-image
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Cache Zolt artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .zolt/cache
          key: zolt-cache-${{ runner.os }}-${{ hashFiles('zolt.lock') }}
          restore-keys: |
            zolt-cache-${{ runner.os }}-

      - name: Cache Zolt managed toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.zolt/toolchains
          key: zolt-toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zolt.lock') }}
          restore-keys: |
            zolt-toolchains-${{ runner.os }}-${{ runner.arch }}-
            zolt-toolchains-${{ runner.os }}-

      - name: Bootstrap sync Zolt-managed Java
        run: scripts/bootstrap-zolt-jvm --no-progress toolchain sync

      - name: Cache npx packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-smoque-0.1.0
          restore-keys: |
            npm-cache-${{ runner.os }}-

      - name: Package stage-0 Zolt
        run: scripts/bootstrap-zolt-jvm --no-progress package --workspace --member apps/zolt --cache-root .zolt/cache

      - name: Sync Zolt-managed Java
        run: scripts/run-zolt-built toolchain sync

      - name: Check Zolt-managed Java status
        run: scripts/run-zolt-built toolchain status --json

      - name: Package CLI with managed Java
        run: scripts/run-zolt-built package --workspace --member apps/zolt --no-progress --cache-root .zolt/cache

      - name: Package JUnit worker with managed Java
        run: scripts/run-zolt-built package --workspace --member apps/zolt-junit-worker --no-progress --cache-root .zolt/cache

      - name: Package javac worker with managed Java
        run: scripts/run-zolt-built package --workspace --member apps/zolt-javac-worker --no-progress --cache-root .zolt/cache

      # An empty matrix.suite expands to no argument, which runs the default smoke/ suite.
      - name: Smoke ${{ matrix.name }} workflows with managed Java
        env:
          ZOLT_SMOKE_PREBUILT: "1"
        run: scripts/smoke-smoque ${{ matrix.suite }}

  managed-toolchain:
    name: managed Java toolchain dogfood ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-native
            runner: ubuntu-latest
            native: true
          - name: macos-build
            runner: macos-15
            native: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up bootstrap GraalVM
        uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f
        with:
          distribution: graalvm
          java-version: "21"
          components: native-image
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Zolt artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .zolt/cache
          key: zolt-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zolt.lock') }}
          restore-keys: |
            zolt-cache-${{ runner.os }}-${{ runner.arch }}-
            zolt-cache-${{ runner.os }}-

      - name: Cache Zolt managed toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.zolt/toolchains
          key: zolt-toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zolt.lock') }}
          restore-keys: |
            zolt-toolchains-${{ runner.os }}-${{ runner.arch }}-
            zolt-toolchains-${{ runner.os }}-

      - name: Bootstrap sync managed Java toolchain
        run: scripts/bootstrap-zolt-jvm --no-progress toolchain sync

      - name: Package bootstrap Zolt
        run: scripts/bootstrap-zolt-jvm --no-progress package --workspace --member apps/zolt --cache-root .zolt/cache

      - name: Sync managed Java toolchain
        run: scripts/run-zolt-built toolchain sync

      - name: Check managed Java status
        run: scripts/run-zolt-built toolchain status --json

      - name: Build with managed Java
        run: scripts/run-zolt-built build --workspace --member apps/zolt --no-progress --cache-root .zolt/cache

      - name: Build native image with managed GraalVM
        if: matrix.native
        run: scripts/run-zolt-built native --workspace --member apps/zolt --no-progress --cache-root .zolt/cache

  windows-smoke:
    # Discovery lane only, and intentionally non-blocking (continue-on-error).
    # Zolt has never been compiled or tested on Windows; this runs the bash
    # bootstrap under the runner's Git Bash to see how far a JVM build plus a
    # couple of small module test suites get, then uploads the log for triage.
    # It MUST NOT gate CI: it never builds a Windows native binary and never
    # publishes to the zap channel. Gate or remove it freely.
    name: windows smoke (discovery, non-blocking)
    needs: test
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Zolt managed toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.zolt/toolchains
          key: zolt-toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zolt.lock') }}
          restore-keys: |
            zolt-toolchains-${{ runner.os }}-${{ runner.arch }}-
            zolt-toolchains-${{ runner.os }}-

      - name: Sync Zolt-managed Java
        run: bash scripts/bootstrap-zolt-jvm --no-progress toolchain sync 2>&1 | tee windows-smoke.log

      - name: Build workspace via bash bootstrap (Git Bash)
        run: bash scripts/bootstrap-zolt-jvm --no-progress build --workspace 2>&1 | tee -a windows-smoke.log

      - name: Smoke-test small members via bash bootstrap (Git Bash)
        run: bash scripts/bootstrap-zolt-jvm --no-progress test --workspace --member modules/zolt-toml --member modules/zolt-model 2>&1 | tee -a windows-smoke.log

      - name: Upload Windows smoke log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-smoke-log
          path: windows-smoke.log
          if-no-files-found: warn
